name: Publish development update

on:
  push:
    branches: ['*']

jobs:
  android_development_build:
    name: Build Development Android
    type: build
    params:
      platform: android
      profile: development
  publish_development_update:
    name: Publish development update
    type: update
    needs: [android_development_build]
    params:
      branch: ${{github.ref_name || 'test'}}
      message: "Update development update for branch ${{github.ref_name}}"
      profile: development
      platform: android
