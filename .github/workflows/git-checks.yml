name: Git Checks

on: [pull_request]

jobs:
  block-fixup:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🛡️ Block Fixup Commit Merge
        uses: 13rac1/block-fixup-merge-action@v2.0.0
